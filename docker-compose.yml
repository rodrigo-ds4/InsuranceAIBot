services:
  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile
    ports:
      - "3000:3000"

  backend:
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY}
      # Point data dirs to a mounted volume for durable Chroma+embeddings.
      DATA_DIR: /app/data
    volumes:
      - ./server/data/policies:/app/data/policies:ro
      - ./server-data:/app/data
    restart: unless-stopped